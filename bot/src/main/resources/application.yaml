app:
  telegram-token: ${TELEGRAM_TOKEN} # env variable
  base_url: http://localhost:8081

spring:
  application:
    name: Bot
  liquibase:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  kafka:
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
    properties:
      spring.json.trusted.packages: '*'
      spring.json.value.default.type: backend.academy.bot.dto.LinkUpdate
    bootstrap-servers: localhost:29092
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
  webclient:
    connect-timeout: 5000
    read-timeout: 5000

bucket4j:
  enabled: true
  cache-to-use: simple
  filters:
    - cache-name: rateLimitCache
      url: .*
      http-status-code: TOO_MANY_REQUESTS
      rate-limits:
        - bandwidths:
            - capacity: 10
              time: 1
              unit: seconds
          expression: "request.getRemoteAddr()"

resilience4j:
  retry:
    instances:
      getLinksRetry:
        max-attempts: 3
        wait-duration: 2s
        retry-exceptions:
          - org.springframework.web.reactive.function.client.WebClientRequestException
          - org.springframework.web.reactive.function.client.WebClientResponseException
          - org.springframework.web.client.HttpServerErrorException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException

  circuitbreaker:
    instances:
      getLinksCB:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 1
        minimum-number-of-calls: 1
        failure-rate-threshold: 100
        permitted-number-of-calls-in-half-open-state: 1
        wait-duration-in-open-state: 1s
server:
  port: 8080

management:
  server:
    port: 8083
  endpoints:
    web:
      exposure:
        include: "info, health, prometheus"
      path-mapping:
        prometheus: metrics
      base-path: /
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui


scrapper:
  base-url: ${SCRAPPER_BASE_URL:http://localhost:8081}
