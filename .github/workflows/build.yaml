name: Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - homework1

jobs:
  build:
    runs-on: edu-self-hosted 
    timeout-minutes: 10
    name: Build
    permissions:
      contents: read
      packages: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'temurin'
          cache: maven

      - name: Start PostgreSQL
        run: |
          docker run --name test-postgres \
          -e POSTGRES_USER=postgres \
          -e POSTGRES_PASSWORD=postgres \
          -e POSTGRES_DB=scrapper \
          -p 5433:5432 -d postgres:17-alpine

      - name: Разрешить запуск Testcontainers
        run: echo "TESTCONTAINERS_RYUK_DISABLED=true" >> $GITHUB_ENV

      - name: maven build
        run: mvn verify

      - name: Остановить и удалить PostgreSQL-контейнер
        if: always() 
        run: docker rm -f test-postgres

  linter:
    name: linter
    runs-on: edu-self-hosted
    container:
      image: maven:3-eclipse-temurin-24
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'temurin'

      - run: mvn compile -am spotless:check modernizer:modernizer spotbugs:check pmd:check pmd:cpd-check
