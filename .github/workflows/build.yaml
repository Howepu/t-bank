name: Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - homework1

jobs:
  build:
    runs-on: ubuntu-latest  # заменено с edu-self-hosted на ubuntu-latest
    timeout-minutes: 10
    name: Build
    permissions:
      contents: read
      packages: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'temurin'
          cache: maven

      - name: Установить Maven
        run: |
          curl -fsSL https://downloads.apache.org/maven/maven-3/3.9.6/binaries/apache-maven-3.9.6-bin.tar.gz -o maven.tar.gz
          tar -xzf maven.tar.gz
          sudo mv apache-maven-3.9.6 /opt/maven
          echo "/opt/maven/bin" >> $GITHUB_PATH

      - name: Запустить Kafka и PostgreSQL
        run: |
          docker network create test-network

          docker run --name test-postgres --network test-network \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=scrapper \
            -p 5433:5432 -d postgres:17-alpine

          docker run --name test-kafka --network test-network -p 9092:9092 \
            -e KAFKA_BROKER_ID=1 \
            -e KAFKA_ZOOKEEPER_CONNECT=localhost:2181 \
            -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092 \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            -e KAFKA_LOG_RETENTION_HOURS=1 \
            -e ALLOW_PLAINTEXT_LISTENER=yes \
            -d bitnami/kafka:latest

      - name: Настройки Testcontainers
        run: |
          echo "TESTCONTAINERS_RYUK_DISABLED=true" >> $GITHUB_ENV

      - name: Maven build
        run: mvn verify

      - name: Очистка Docker
        if: always()
        run: |
          docker rm -f test-postgres || true
          docker rm -f test-kafka || true
          docker network rm test-network || true

  linter:
    name: linter
    runs-on: ubuntu-latest  # заменено с edu-self-hosted
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'temurin'

      - run: mvn compile -am spotless:check modernizer:modernizer spotbugs:check pmd:check pmd:cpd-check
