name: Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - homework1

jobs:
  build:
    name: Build
    permissions:
      contents: read
      packages: write
      pull-requests: write
    runs-on: edu-self-hosted
    container:
      image: maven:3.9.6-eclipse-temurin-23
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'temurin'
          cache: maven
      - name: Start PostgreSQL
        run: |
          docker run --name test-postgres \
          -e POSTGRES_USER=postgres \
          -e POSTGRES_PASSWORD=postgres \
          -e POSTGRES_DB=scrapper \
          -p 5433:5432 -d postgres:17-alpine
      - name: Разрешить запуск Testcontainers
        run: echo "TESTCONTAINERS_RYUK_DISABLED=true" >> $GITHUB_ENV

      - name: maven build
        run: mvn verify

      - id: jacoco
        uses: madrapps/jacoco-report@v1.7.1
        if: ( github.event_name != 'workflow_dispatch' )
        with:
          paths: ${{ github.workspace }}/report/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 30
          min-coverage-changed-files: 30
          title: Code Coverage
          update-comment: true

  linter:
    name: linter
    permissions:
      contents: read
      packages: write
      pull-requests: write
    runs-on: edu-self-hosted
    container:
      image: maven:3-eclipse-temurin-23
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'temurin'

      - run: mvn compile -am spotless:check modernizer:modernizer spotbugs:check pmd:check pmd:cpd-check
