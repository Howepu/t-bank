app:
  message-transport: kafka
  database-access-type: jpa
  cron: "30 45 17 * * *"
  github-token: ${GITHUB_TOKEN} # env variable
  stackoverflow:
    key: ${SO_TOKEN_KEY}
    access-token: ${SO_ACCESS_TOKEN}
  kafka-topic-updates: updates

spring:
  application:
    name: Scrapper

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:scrapper}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 600000
      connection-timeout: 30000
      max-lifetime: 1800000

  kafka:
    bootstrap-servers: localhost:29092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  data:
    redis:
      host: localhost
      port: 6379

  webclient:
    connect-timeout: 5000
    read-timeout: 5000

bucket4j:
  enabled: true
  cache-to-use: simple
  filters:
    - cache-name: rateLimitCache
      url: .*
      http-status-code: TOO_MANY_REQUESTS
      rate-limits:
        - bandwidths:
            - capacity: 10
              time: 1
              unit: seconds
          expression: "request.getRemoteAddr()"

resilience4j:
  retry:
    instances:
      UpdateRetry:
        max-attempts: 3
        wait-duration: 2s
        retry-exceptions:
          - org.springframework.web.reactive.function.client.WebClientRequestException
          - org.springframework.web.reactive.function.client.WebClientResponseException.InternalServerError
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException

  circuitbreaker:
    instances:
      UpdateCB:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 1
        minimum-number-of-calls: 1
        failure-rate-threshold: 100
        permitted-number-of-calls-in-half-open-state: 1
        wait-duration-in-open-state: 1s


server:
  port: 8081

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui
